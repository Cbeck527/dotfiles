set-environment -g TMUX_CONFIG_FILE "~/.config/tmux/tmux.conf"
bind-key R source-file ~/.config/tmux/tmux.conf \; \
                   display-message "Reloaded tmux config"

# plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
# NOTE: take a look at this w/ nix
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'

# -- global --------------------------------------------------------------------
set -g prefix C-a  # <3 GNU Screen
unbind C-b
bind a send-prefix
set -g history-limit 50000
set -g status-keys emacs
set -g focus-events on
set -g mouse on

# tmux-resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15' # save every 15 minutes
set -g @continuum-boot 'off' # don't start tmux on boot

# -- navigation ----------------------------------------------------------------
TMUX_FZF_LAUNCH_KEY="C-f"
TMUX_FZF_PREVIEW=0
TMUX_FZF_SWITCH_CURRENT=1
bind C-c command-prompt -p 'New session name: ' 'new-session -s "%%"' # create session like screen

# window navigation
unbind n
unbind p
bind C-n next-window
bind C-p previous-window
bind C-a last-window

unbind '"'
unbind '%'
bind S split-window -v -c "#{pane_current_path}"  # split current window horizontally
bind | split-window -h -c "#{pane_current_path}"  # split current window vertically

# new window with name
bind-key C command-prompt -p 'New window name:' "new-window -n %%"

# pane navigation
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# maximize current pane
bind Q resize-pane -Z

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# -- display -------------------------------------------------------------------
set -g set-titles on           # set terminal title (window number, program name, active (or not)
set -g set-titles-string '#S-#I-#P #W'

set -g display-panes-time 800  # slightly longer pane indicators display time
set -g display-time 4000       # slightly longer status messages display time

# activity
set -g monitor-activity on
set -g visual-activity off

# prefix highlight plugin config
set -g @prefix_highlight_fg 'cyan,bold'
set -g @prefix_highlight_bg 'default'

set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=yellow,bold'
set -g @prefix_highlight_copy_prompt 'Copy'

set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_sync_mode_attr 'fg=red,bold'
set -g @prefix_highlight_sync_prompt 'SYNC'

set -g base-index 1            # start windows numbering at 1
set -g renumber-windows on     # renumber windows when a window is closed
set -g status-interval 5       # redraw status line every 5 seconds
setw -g automatic-rename on    # rename window to reflect current program
setw -g pane-base-index 1      # make pane numbering consistent with windows

# timing improvements
set -s escape-time 0           # faster command sequences
set -sg repeat-time 600        # increase repeat timeout

# statusline like screen
set -g status-interval 5
set -g status-justify absolute-centre
set -g status-left '#[fg=default][ #[fg=blue]#S #[fg=default]]'
set -g status-right '#{prefix_highlight} #(cut -c3- ~/.tmux.conf | sh -s _username) #(cut -c3- ~/.tmux.conf | sh -s _hostname)'
set -g status-right-length 1000
set -g status-left-length 1000
set -g status-style fg=cyan,bg=black
setw -g window-status-current-format '#[fg=red]( #[fg=white]#I- #W#[fg=red]#F )'
setw -g window-status-format '#I #W#F '

# -- cb custom -----------------------------------------------------------------
bind C-y setw synchronize-panes  # sync panes with C-a C-y
bind C-x setw synchronize-panes  # sync panes with C-a C-y

# copy mode - use ESC to exit (both emacs and vi modes)
bind-key -T copy-mode Escape send-keys -X cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

bind J select-layout even-vertical
bind H select-layout even-horizontal

# source local config (if it exists)
source -q ~/.tmux.conf.local

run "~/.config/tmux/plugins/tpm/tpm"
